<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>슈카친구들 객장</title>
<style>
  :root{
    --bg:#0c0e13; --panel:rgba(18,21,28,.86); --line:rgba(255,255,255,.12);
    --text:#eef1f6; --dim:#9aa3b2; --amber:#ffb834; --blue:#58a6ff; --red:#ff5d5d;
    --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:var(--font);overflow:hidden}
  #stage{position:fixed;inset:0;overflow:hidden;background:#000}
  #ytwrap{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;visibility:hidden;background:#000}
  #ytwrap iframe{width:100%;height:100%;border:0;display:block}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #cv.pass{pointer-events:none}
  #lb{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px;color:var(--text)}
  #topleft{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:10px;font-weight:700}
  #topleft .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block}
  #topleft small{font-weight:500;color:var(--dim);font-size:13px}
  #topright{position:absolute;right:14px;top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
  button{font-family:inherit;color:inherit;cursor:pointer}
  button.pill:hover{border-color:rgba(255,255,255,.3)}
  button.pill.on{border-color:var(--amber);color:var(--amber)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  #chatbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(720px,calc(100vw - 28px));
    display:flex;gap:8px;align-items:center;padding:6px 6px 6px 18px}
  #chatbar input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:15px;min-width:0}
  #chatbar input::placeholder{color:var(--dim)}
  #chatbar button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.1);font-size:16px}
  #hint{position:absolute;left:14px;bottom:18px;font-size:12px;color:var(--dim);line-height:1.6;pointer-events:none}
  @media (max-width:900px){#hint{display:none}}
  @media (max-width:1180px){#topright{top:62px;left:14px;max-width:none;justify-content:flex-start}#topright .pill{padding:8px 12px;font-size:13px}#pop{top:150px}#toast{top:160px}}
  #pop{position:absolute;right:14px;top:64px;width:min(360px,calc(100vw - 28px));background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;font-size:13px}
  #pop.show{display:block}
  #pop h3{margin:0 0 10px;font-size:14px}
  #pop label{display:block;color:var(--dim);margin:12px 0 6px}
  #pop .row{display:flex;gap:6px}
  #pop input[type=text]{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--text);font:inherit}
  #pop input[type=range]{width:100%}
  #pop .btn{background:var(--amber);color:#201600;border:0;border-radius:10px;padding:9px 12px;font-weight:700}
  #pop .alt2{background:rgba(255,255,255,.1);color:var(--text);font-weight:600;flex:1}
  #pop p{color:var(--dim);margin:8px 0 0;line-height:1.5}
  #toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);display:none;max-width:calc(100vw - 28px);text-align:center}
  #toast.show{display:block}
  /* entry */
  #entry{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 700px at 50% 30%,#1b2130 0%,#0c0e13 60%,#07080b 100%);z-index:10;padding:16px}
  #entry.hide{display:none}
  .card{width:min(420px,100%);background:rgba(20,23,31,.9);border:1px solid var(--line);border-radius:22px;padding:26px 24px 22px;text-align:center}
  .card h1{margin:0;font-size:24px;letter-spacing:-.02em}
  .card .sub{color:var(--dim);font-size:13px;margin:6px 0 4px}
  #pv{width:220px;height:220px;display:block;margin:6px auto 0}
  #pvtitle{font-size:15px;font-weight:700;color:var(--amber);min-height:22px;margin-bottom:12px}
  .card input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--text);
    font:inherit;font-size:16px;text-align:center}
  .card .go{width:100%;margin-top:10px;background:var(--amber);color:#201600;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:800}
  .card .go:disabled{opacity:.45;cursor:default}
  .card .alt{margin-top:10px;background:transparent;border:0;color:var(--dim);font-size:13px;text-decoration:underline}
  #estatus{min-height:18px;font-size:12px;color:var(--dim);margin-top:10px;line-height:1.5}
  #estatus.err{color:var(--red)}
</style>
</head>
<body>
<div id="stage">
  <div id="ytwrap"></div>
  <canvas id="cv"></canvas>
  <canvas id="lb"></canvas>

  <div id="topleft" class="pill"><span>슈카친구들 객장</span><span class="dot"></span><small id="count">0명 함께 보는 중</small></div>
  <div id="topright">
    <button class="pill" id="bInvite">초대 링크 복사</button>
    <button class="pill" id="bSound">소리 켜기</button>
    <button class="pill" id="bPass" title="켜면 유튜브 화면을 직접 클릭할 수 있습니다">화면 직접 조작</button>
    <button class="pill" id="bWalk">자동 산책</button>
    <button class="pill" id="bQ">그래픽: 고급</button>
    <button class="pill" id="bSet">방 설정</button>
  </div>
  <div id="pop">
    <h3>방 설정</h3>
    <div id="hostOnly">
      <label for="yt">가운데 화면에 틀 유튜브 주소 (라이브·일반 영상 모두 가능)</label>
      <div class="row"><input type="text" id="yt" placeholder="비우고 적용하면 방송을 끕니다"><button class="btn" id="ytGo">적용</button></div>
      <div class="row" style="margin-top:6px"><button class="btn alt2" id="ytDef">슈카월드 최신 영상으로</button></div>
      <label for="bots">자리 채우는 봇 개미 수: <b id="botsN">60</b></label>
      <input type="range" id="bots" min="0" max="100" value="60">
    </div>
    <p id="popNote"></p>
    <label>초대 링크</label>
    <div class="row"><input type="text" id="link" readonly></div>
  </div>
  <div id="toast" class="pill"></div>
  <div id="hint">이동: WASD · 방향키 · 바닥 클릭<br>시점: 드래그 · 휠<br>채팅: Enter</div>
  <form id="chatbar" class="pill" autocomplete="off">
    <input id="chat" maxlength="60" placeholder="한마디 남기기">
    <button type="submit" aria-label="보내기">→</button>
  </form>
</div>

<div id="entry">
  <div class="card">
    <h1>슈카친구들 객장</h1>
    <div class="sub">이름을 넣으면 그 이름의 개미가 만들어집니다</div>
    <canvas id="pv" width="440" height="440"></canvas>
    <div id="pvtitle"></div>
    <input id="name" maxlength="12" placeholder="이름 입력" autocomplete="off">
    <button class="go" id="go" disabled>입장하기</button>
    <button class="alt" id="alt" style="display:none">이 방 말고 새 방 만들기</button>
    <div id="estatus"></div>
  </div>
</div>

  if(location.protocol==="file:")toast("파일로 직접 열면 유튜브가 재생되지 않을 수 있습니다. 웹에 올려서 열어 주세요.",6000);
}
function startHost(name){
  roomCode="";var al="abcdefghjkmnpqrstuvwxyz23456789";for(var i=0;i<6;i++)roomCode+=al[(Math.random()*al.length)|0];
  status("방을 만드는 중...");
  var ready=function(online){
    isHost=true;myId="h";var p=spawnPos();me=addEnt("h",name,false,p[0]*.3,8,Math.PI);setBots(botTarget);setVideo(DEFAULT_VIDEO);
    try{history.replaceState(null,"","#room-"+roomCode)}catch(_){location.hash="room-"+roomCode}
    enterRoom();
    if(!online)toast("연결 서버에 닿지 못했습니다. 지금은 혼자 보기 모드입니다.",6000);
  };
  (useBC?bcHost(roomCode,hostOnConn):pjHost(roomCode,hostOnConn)).then(function(){ready(true)},function(){ready(false)});
}
function startJoin(name,code){
  roomCode=code;status("방에 들어가는 중...");
  (useBC?bcJoin(code):pjJoin(code)).then(function(c){
    hostConn=c;c.ondata=clientOnData;c.onclose=function(){toast("방장과 연결이 끊겼습니다. 새로고침해서 다시 들어와 주세요.",1e9)};
    c.send({t:"hi",n:name});
  },function(){fail("방을 찾지 못했습니다. 방장이 방을 열어 두었는지 확인해 주세요.")});
}
$("name").addEventListener("input",function(){var n=clean(this.value,12);$("go").disabled=!n;
  setPreview(n);$("pvtitle").textContent=n?pvEnt.look.title:""});
$("name").addEventListener("keydown",function(ev){if(ev.key==="Enter"&&!$("go").disabled)$("go").click()});
$("go").onclick=function(){var n=clean($("name").value,12);if(!n)return;this.disabled=true;if(joinCode)startJoin(n,joinCode);else startHost(n)};
$("alt").onclick=function(){joinCode="";this.style.display="none";$("go").textContent="방 만들기";$("go").disabled=!clean($("name").value,12);status("")};
if(joinCode){$("go").textContent="입장하기";$("alt").style.display="";status("초대받은 방: "+joinCode)}else $("go").textContent="방 만들기";
$("name").focus();
requestAnimationFrame(frame);
window.__dbg={ents:function(){return ents},me:function(){return me},cam:cam,setVideo:setVideo,renderer:renderer,q:function(){return quality}};
</script>
