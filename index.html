<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>슈카친구들 객장</title>
<style>
  :root{
    --bg:#0c0e13; --panel:rgba(18,21,28,.86); --line:rgba(255,255,255,.12);
    --text:#eef1f6; --dim:#9aa3b2; --amber:#ffb834; --blue:#58a6ff; --red:#ff5d5d;
    --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:var(--font);overflow:hidden}
  #stage{position:fixed;inset:0;overflow:hidden;background:#000}
  #ytwrap{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;visibility:hidden;background:#000}
  #ytwrap iframe{width:100%;height:100%;border:0;display:block}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #cv.pass{pointer-events:none}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px;color:var(--text)}
  #topleft{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:10px;font-weight:700}
  #topleft .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block}
  #topleft small{font-weight:500;color:var(--dim);font-size:13px}
  #topright{position:absolute;right:14px;top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
  button{font-family:inherit;color:inherit;cursor:pointer}
  button.pill:hover{border-color:rgba(255,255,255,.3)}
  button.pill.on{border-color:var(--amber);color:var(--amber)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  #chatbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(720px,calc(100vw - 28px));
    display:flex;gap:8px;align-items:center;padding:6px 6px 6px 18px}
  #chatbar input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:15px;min-width:0}
  #chatbar input::placeholder{color:var(--dim)}
  #chatbar button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.1);font-size:16px}
  #hint{position:absolute;left:14px;bottom:18px;font-size:12px;color:var(--dim);line-height:1.6;pointer-events:none}
  @media (max-width:900px){#hint{display:none}}
  #pop{position:absolute;right:14px;top:64px;width:min(360px,calc(100vw - 28px));background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;font-size:13px}
  #pop.show{display:block}
  #pop h3{margin:0 0 10px;font-size:14px}
  #pop label{display:block;color:var(--dim);margin:12px 0 6px}
  #pop .row{display:flex;gap:6px}
  #pop input[type=text]{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--text);font:inherit}
  #pop input[type=range]{width:100%}
  #pop .btn{background:var(--amber);color:#201600;border:0;border-radius:10px;padding:9px 12px;font-weight:700}
  #pop p{color:var(--dim);margin:8px 0 0;line-height:1.5}
  #toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);display:none;max-width:calc(100vw - 28px);text-align:center}
  #toast.show{display:block}
  /* entry */
  #entry{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 700px at 50% 30%,#1b2130 0%,#0c0e13 60%,#07080b 100%);z-index:10;padding:16px}
  #entry.hide{display:none}
  .card{width:min(420px,100%);background:rgba(20,23,31,.9);border:1px solid var(--line);border-radius:22px;padding:26px 24px 22px;text-align:center}
  .card h1{margin:0;font-size:24px;letter-spacing:-.02em}
  .card .sub{color:var(--dim);font-size:13px;margin:6px 0 4px}
  #pv{width:220px;height:220px;display:block;margin:6px auto 0}
  #pvtitle{font-size:15px;font-weight:700;color:var(--amber);min-height:22px;margin-bottom:12px}
  .card input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--text);
    font:inherit;font-size:16px;text-align:center}
  .card .go{width:100%;margin-top:10px;background:var(--amber);color:#201600;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:800}
  .card .go:disabled{opacity:.45;cursor:default}
  .card .alt{margin-top:10px;background:transparent;border:0;color:var(--dim);font-size:13px;text-decoration:underline}
  #estatus{min-height:18px;font-size:12px;color:var(--dim);margin-top:10px;line-height:1.5}
  #estatus.err{color:var(--red)}
</style>
</head>
<body>
<div id="stage">
  <div id="ytwrap"></div>
  <canvas id="cv"></canvas>

  <div id="topleft" class="pill"><span>슈카친구들 객장</span><span class="dot"></span><small id="count">0명 함께 보는 중</small></div>
  <div id="topright">
    <button class="pill" id="bInvite">초대 링크 복사</button>
    <button class="pill" id="bSound">소리 켜기</button>
    <button class="pill" id="bPass" title="켜면 유튜브 화면을 직접 클릭할 수 있습니다">화면 직접 조작</button>
    <button class="pill" id="bWalk">자동 산책</button>
    <button class="pill" id="bSet">방 설정</button>
  </div>
  <div id="pop">
    <h3>방 설정</h3>
    <div id="hostOnly">
      <label for="yt">가운데 화면에 틀 유튜브 주소 (라이브·일반 영상 모두 가능)</label>
      <div class="row"><input type="text" id="yt" placeholder="https://www.youtube.com/watch?v=..."><button class="btn" id="ytGo">적용</button></div>
      <label for="bots">자리 채우는 봇 개미 수: <b id="botsN">60</b></label>
      <input type="range" id="bots" min="0" max="100" value="60">
    </div>
    <p id="popNote"></p>
    <label>초대 링크</label>
    <div class="row"><input type="text" id="link" readonly></div>
  </div>
  <div id="toast" class="pill"></div>
  <div id="hint">이동: WASD · 방향키 · 바닥 클릭<br>시점: 드래그 · 휠<br>채팅: Enter</div>
  <form id="chatbar" class="pill" autocomplete="off">
    <input id="chat" maxlength="60" placeholder="한마디 남기기">
    <button type="submit" aria-label="보내기">→</button>
  </form>
</div>

<div id="entry">
  <div class="card">
    <h1>슈카친구들 객장</h1>
    <div class="sub">이름을 넣으면 그 이름의 개미가 만들어집니다</div>
    <canvas id="pv" width="440" height="440"></canvas>
    <div id="pvtitle"></div>
    <input id="name" maxlength="12" placeholder="이름 입력" autocomplete="off">
    <button class="go" id="go" disabled>입장하기</button>
    <button class="alt" id="alt" style="display:none">이 방 말고 새 방 만들기</button>
    <div id="estatus"></div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
(function(){
"use strict";
/* ───────────── 공용 유틸 ───────────── */
var $=function(id){return document.getElementById(id)};
var clamp=function(v,a,b){return v<a?a:v>b?b:v};
function hashStr(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function clean(s,n){return String(s==null?"":s).replace(/[\u0000-\u001f\u007f]/g,"").trim().slice(0,n)}
function shade(hex,k){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  if(k<0){r*=1+k;g*=1+k;b*=1+k}else{r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k}
  return "rgb("+(r|0)+","+(g|0)+","+(b|0)+")"}

/* ───────────── 이름 → 개미 외형 ───────────── */
var ADJ=["침착한","성실한","떨리는","존버하는","물타는","익절한","느긋한","용감한","신중한","배고픈","졸린","씩씩한","소심한","야수의","꾸준한","호기심 많은"];
var TYPES=[
  {k:"일개미",w:38,c:["#c9773f","#b5652f","#d98a4e","#a85a32","#e09a5a"],acc:["none","none","hat","tie"],s:[.9,1.08]},
  {k:"불개미",w:15,c:["#d8452e","#e2603a","#c43a3a"],acc:["none","tie","band"],s:[.9,1.05]},
  {k:"병정개미",w:12,c:["#7d8794","#6b7480","#8f8a80"],acc:["helmet"],s:[1.02,1.18]},
  {k:"동학개미",w:15,c:["#d9a441","#c9923a","#e0b45a"],acc:["band"],s:[.9,1.08]},
  {k:"서학개미",w:15,c:["#5b4636","#4a3b33","#6a5142"],acc:["glasses"],s:[.92,1.1]},
  {k:"왕개미",w:5,c:["#3a3f4a","#2f333d","#4a3f52"],acc:["crown"],s:[1.28,1.42]}
];
function lookOf(name){
  var r=rng(hashStr("ant:"+name)), tot=0,i,t;
  for(i=0;i<TYPES.length;i++)tot+=TYPES[i].w;
  var x=r()*tot;for(i=0;i<TYPES.length;i++){x-=TYPES[i].w;if(x<=0)break}
  t=TYPES[Math.min(i,TYPES.length-1)];
  return {type:t.k, title:ADJ[(r()*ADJ.length)|0]+" "+t.k, color:t.c[(r()*t.c.length)|0],
    acc:t.acc[(r()*t.acc.length)|0], scale:t.s[0]+r()*(t.s[1]-t.s[0]),
    head:.92+r()*.2, belly:.9+r()*.25, eye:.85+r()*.35, ant:.8+r()*.5, antSpread:.7+r()*.6, phase:r()*6.28};
}

/* ───────────── 방 크기 ───────────── */
var RW=18, RD=15, RH=15.5;             // 반폭, 반깊이, 높이
var SCR={w:19.2,h:10.8,y0:2.4};       // 뒷벽(z=-RD) 스크린
var SCREEN_C={x:0,z:-RD};

/* ───────────── 렌더러 (Canvas 2D 원근 투영) ───────────── */
function makeView(canvas){
  return {cv:canvas,ctx:canvas.getContext("2d"),W:0,H:0,dpr:1,foc:1,cx:0,cy:0,
    C:[0,0,0],R:[1,0,0],U:[0,1,0],F:[0,0,-1]};
}
function setCam(v,T,yaw,pitch,dist){
  var cp=Math.cos(pitch),sp=Math.sin(pitch),sy=Math.sin(yaw),cy=Math.cos(yaw);
  v.C=[T[0]+dist*sy*cp,T[1]+dist*sp,T[2]+dist*cy*cp];
  v.F=[-sy*cp,-sp,-cy*cp]; v.R=[cy,0,-sy];
  v.U=[v.R[1]*v.F[2]-v.R[2]*v.F[1], v.R[2]*v.F[0]-v.R[0]*v.F[2], v.R[0]*v.F[1]-v.R[1]*v.F[0]];
}
function toView(v,x,y,z){var dx=x-v.C[0],dy=y-v.C[1],dz=z-v.C[2];
  return [dx*v.R[0]+dy*v.R[1]+dz*v.R[2], dx*v.U[0]+dy*v.U[1]+dz*v.U[2], dx*v.F[0]+dy*v.F[1]+dz*v.F[2]]}
function proj(v,p){return [v.cx+v.foc*p[0]/p[2], v.cy-v.foc*p[1]/p[2]]}
var NEAR=.15;
function clipNear(pts){ // 뷰 공간 다각형을 near 평면으로 자르기
  var out=[],n=pts.length,i,a,b,t;
  for(i=0;i<n;i++){a=pts[i];b=pts[(i+1)%n];
    var ia=a[2]>=NEAR, ib=b[2]>=NEAR;
    if(ia)out.push(a);
    if(ia!==ib){t=(NEAR-a[2])/(b[2]-a[2]);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,NEAR])}
  }
  return out;
}
function poly(v,world,fill){
  var vs=[],i;for(i=0;i<world.length;i++)vs.push(toView(v,world[i][0],world[i][1],world[i][2]));
  vs=clipNear(vs);if(vs.length<3)return false;
  var c=v.ctx;c.beginPath();
  for(i=0;i<vs.length;i++){var p=proj(v,vs[i]);if(i)c.lineTo(p[0],p[1]);else c.moveTo(p[0],p[1])}
  c.closePath();if(fill){c.fillStyle=fill;c.fill()}
  return true;
}
function line3(v,a,b,stroke,w){
  var p=toView(v,a[0],a[1],a[2]),q=toView(v,b[0],b[1],b[2]);
  if(p[2]<NEAR&&q[2]<NEAR)return;
  if(p[2]<NEAR||q[2]<NEAR){var t=(NEAR-p[2])/(q[2]-p[2]),m=[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,NEAR];if(p[2]<NEAR)p=m;else q=m}
  var P=proj(v,p),Q=proj(v,q),c=v.ctx;c.beginPath();c.moveTo(P[0],P[1]);c.lineTo(Q[0],Q[1]);c.strokeStyle=stroke;c.lineWidth=w;c.stroke();
}
// 벽면 위에 평면 그림 그리기 (아핀 근사). tl, tr, bl = 월드 좌표
function onPlane(v,tl,tr,bl,w,h,fn){
  var a=toView(v,tl[0],tl[1],tl[2]),b=toView(v,tr[0],tr[1],tr[2]),d=toView(v,bl[0],bl[1],bl[2]);
  if(a[2]<NEAR||b[2]<NEAR||d[2]<NEAR)return;
  var A=proj(v,a),B=proj(v,b),D=proj(v,d),c=v.ctx,k=v.dpr;
  c.save();c.setTransform((B[0]-A[0])/w*k,(B[1]-A[1])/w*k,(D[0]-A[0])/h*k,(D[1]-A[1])/h*k,A[0]*k,A[1]*k);
  fn(c);c.restore();
}

/* 구 스프라이트 캐시 */
var sprites={};
function sphereSprite(color){
  var s=sprites[color];if(s)return s;
  s=document.createElement("canvas");s.width=s.height=96;
  var c=s.getContext("2d"),g=c.createRadialGradient(36,30,4,48,48,48);
  g.addColorStop(0,shade(color,.45));g.addColorStop(.45,color);g.addColorStop(1,shade(color,-.45));
  c.fillStyle=g;c.beginPath();c.arc(48,48,47,0,6.2832);c.fill();
  sprites[color]=s;return s;
}

/* 개미 한 마리 그리기. 반환: 머리 위 화면 좌표 */
function drawAnt(v,e,time){
  var L=e.look,s=L.scale,c=v.ctx,cr=Math.cos(e.r),sr=Math.sin(e.r);
  var walk=e.moving?Math.sin(time*11+L.phase):0, bob=e.moving?Math.abs(Math.sin(time*11+L.phase))*.06:Math.sin(time*2+L.phase)*.015;
  function W(px,py,pz){px*=s;py=(py+bob)*s;pz*=s;return toView(v,e.x+px*cr+pz*sr,py,e.z-px*sr+pz*cr)}
  var base=toView(v,e.x,0,e.z);
  if(base[2]<NEAR+.6)return null;
  var k=v.foc/base[2];
  // 그림자
  var sp=proj(v,base),ell=clamp(Math.abs(v.F[1])+.12,.15,1);
  c.fillStyle="rgba(0,0,0,.32)";c.beginPath();c.ellipse(sp[0],sp[1],.62*s*k,.62*s*k*ell,0,0,6.2832);c.fill();

  var dark=shade(L.color,-.5), parts=[];
  function ball(p,r,col,extra){parts.push({z:p[2],t:0,p:p,r:r*s,col:col,x:extra})}
  function limb(a,b,w){parts.push({z:(a[2]+b[2])/2+.01,t:1,a:a,b:b,w:w*s})}
  var hr=.40*L.head, ab=.40*L.belly;
  var pAb=W(0,.40,-.30), pTh=W(0,.84,-.03), pHd=W(0,1.36,.07);
  ball(pAb,ab,L.color);ball(pTh,.29,L.color);ball(pHd,hr,L.color,"head");
  // 다리·팔
  limb(W(.15,.62,0),W(.2,0,.22*walk),.085);limb(W(-.15,.62,0),W(-.2,0,-.22*walk),.085);
  limb(W(.24,.92,.03),W(.42,.6,.12-.2*walk),.07);limb(W(-.24,.92,.03),W(-.42,.6,.12+.2*walk),.07);
  // 더듬이
  var as=.15*L.antSpread, al=L.ant, sway=Math.sin(time*3+L.phase)*.03;
  var t1=W(as+.16*al+sway,1.36+hr+.42*al,.2), t2=W(-as-.16*al+sway,1.36+hr+.42*al,.2);
  limb(W(as,1.36+hr*.85,.1),t1,.045);limb(W(-as,1.36+hr*.85,.1),t2,.045);
  ball(t1,.065,dark);ball(t2,.065,dark);
  // 눈
  var ex=.17*L.head, ez=.07+hr*.86, er=.115*L.eye;
  var e1=W(ex,1.42,ez),e2=W(-ex,1.42,ez);
  var facing=e1[2]<pHd[2]-.06*s||e2[2]<pHd[2]-.06*s;
  if(e1[2]<pHd[2]-.02*s)parts.push({z:pHd[2]-.5,t:2,p:e1,pp:W(ex,1.42,ez+.08),r:er*s});
  if(e2[2]<pHd[2]-.02*s)parts.push({z:pHd[2]-.5,t:2,p:e2,pp:W(-ex,1.42,ez+.08),r:er*s});
  if(L.acc==="tie"){var tk=W(0,.98,.27);if(tk[2]<pTh[2])parts.push({z:pTh[2]-.4,t:3,p:tk})}

  parts.sort(function(a,b){return b.z-a.z});
  for(var i=0;i<parts.length;i++){
    var q=parts[i],P,rr;
    if(q.z<NEAR)continue;
    if(q.t===0){P=proj(v,q.p);rr=q.r*v.foc/q.p[2];
      c.drawImage(sphereSprite(q.col),P[0]-rr,P[1]-rr,rr*2,rr*2);
      if(q.x==="head")drawHeadAcc(c,L,P,rr,facing);
    }else if(q.t===1){
      if(q.a[2]<NEAR||q.b[2]<NEAR)continue;
      var A=proj(v,q.a),B=proj(v,q.b);c.strokeStyle=dark;c.lineCap="round";c.lineWidth=Math.max(1,q.w*v.foc/q.z);
      c.beginPath();c.moveTo(A[0],A[1]);c.lineTo(B[0],B[1]);c.stroke();
    }else if(q.t===2){
      if(q.p[2]<NEAR)continue;P=proj(v,q.p);rr=q.r*v.foc/q.p[2];var PP=proj(v,q.pp);
      c.fillStyle="#fff";c.beginPath();c.arc(P[0],P[1],rr,0,6.2832);c.fill();
      c.fillStyle="#15171c";c.beginPath();c.arc(P[0]+(PP[0]-P[0])*.6,P[1]+(PP[1]-P[1])*.6,rr*.52,0,6.2832);c.fill();
      if(L.acc==="glasses"){c.strokeStyle="#111";c.lineWidth=Math.max(1,rr*.28);c.beginPath();c.arc(P[0],P[1],rr*1.25,0,6.2832);c.stroke()}
    }else if(q.t===3){
      P=proj(v,q.p);rr=.1*s*v.foc/q.p[2];c.fillStyle="#d43a3a";
      c.beginPath();c.moveTo(P[0]-rr*.6,P[1]-rr);c.lineTo(P[0]+rr*.6,P[1]-rr);c.lineTo(P[0]+rr*.9,P[1]+rr*1.6);c.lineTo(P[0],P[1]+rr*2.6);c.lineTo(P[0]-rr*.9,P[1]+rr*1.6);c.closePath();c.fill();
    }
  }
  var top=W(0,1.36+hr+.55*L.ant+.25,0);
  if(top[2]<NEAR)return null;
  var tp=proj(v,top);return {x:tp[0],y:tp[1],z:base[2],k:k};
}
function drawHeadAcc(c,L,P,r,facing){
  var a=L.acc;
  if(a==="hat"||a==="helmet"){
    c.fillStyle=a==="hat"?"#ffcf33":"#4c5a3c";
    c.beginPath();c.arc(P[0],P[1]-r*.12,r*1.04,Math.PI,0);c.closePath();c.fill();
    c.fillRect(P[0]-r*1.22,P[1]-r*.2,r*2.44,r*.2);
  }else if(a==="band"){

function bcHost(code,onConn){
  var ch=new BroadcastChannel(PREFIX+code),cs={};
  ch.onmessage=function(ev){var m=ev.data;if(m.to!=="host")return;
    if(m.k==="open"){var c={id:m.from,send:function(d){ch.postMessage({to:m.from,k:"d",d:d})},close:function(){ch.postMessage({to:m.from,k:"close"})}};cs[m.from]=c;onConn(c);ch.postMessage({to:m.from,k:"ack"})}

    else if(m.k==="close"&&cs[m.from]){if(cs[m.from].onclose)cs[m.from].onclose();delete cs[m.from]}};
  return Promise.resolve();
}
function bcJoin(code){
  return new Promise(function(res,rej){
    var ch=new BroadcastChannel(PREFIX+code),id="c"+Math.random().toString(36).slice(2,9),done=false;
    var c={send:function(d){ch.postMessage({to:"host",from:id,k:"d",d:d})},close:function(){ch.postMessage({to:"host",from:id,k:"close"})}};
    ch.onmessage=function(ev){var m=ev.data;if(m.to!==id)return;
      if(m.k==="ack"){done=true;res(c)}else if(m.k==="d"&&c.ondata)c.ondata(m.d);else if(m.k==="close"&&c.onclose)c.onclose()};
    ch.postMessage({to:"host",from:id,k:"open"});

function pjHost(code,onConn){
  return new Promise(function(res,rej){
    var peer=new Peer(PREFIX+code),opened=false;
    peer.on("open",function(){opened=true;res()});
    peer.on("connection",function(dc){
      var c={id:dc.peer,send:function(d){if(dc.open)dc.send(d)},close:function(){dc.close()}};
      dc.on("open",function(){onConn(c)});
      dc.on("data",function(d){if(c.ondata)c.ondata(d)});
      dc.on("close",function(){if(c.onclose)c.onclose()});
      dc.on("error",function(){if(c.onclose)c.onclose()});
    });
    peer.on("disconnected",function(){try{peer.reconnect()}catch(_){}});
    peer.on("error",function(err){if(!opened)rej(err)});
    setTimeout(function(){if(!opened)rej(new Error("timeout"))},12000);
  });
}
function pjJoin(code){
  return new Promise(function(res,rej){
    var peer=new Peer(),done=false;
    peer.on("open",function(){
      var dc=peer.connect(PREFIX+code,{reliable:true,serialization:"json"});
      var c={send:function(d){if(dc.open)dc.send(d)},close:function(){dc.close()}};
      dc.on("open",function(){done=true;res(c)});

      g.save();g.beginPath();g.rect(0,0,2000,100);g.clip();g.font="700 54px "+FONT;g.textBaseline="middle";g.fillStyle="#ffb834";
      var s="슈카친구들 객장    ·    시황 방송 같이 보는 곳    ·    투자의 책임은 투자자 본인에게 있습니다    ·    ",wd=g.measureText(s).width,o=-(time*90)%wd;
      for(var X=o;X<2000;X+=wd)g.fillText(s,X,52);g.restore();
    });
  }
  $("ytwrap").style.visibility=holeOK?"visible":"hidden";
}
var FONT=getComputedStyle(document.documentElement).getPropertyValue("--font");

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawLabel(v,e,L,now){
  var c=v.ctx,fs=clamp(L.k*.36,0,17),talking=e.say&&now<e.sayT;if(fs<9.5&&e!==me&&!talking)return;
  fs=Math.max(fs,e===me?12:9.5);
  c.font="700 "+fs+"px "+FONT;c.textAlign="center";c.textBaseline="middle";
  var w=c.measureText(e.name).width+fs*1.3,h=fs*1.7,x=L.x-w/2,y=L.y-h;
  c.fillStyle=e===me?"rgba(40,28,0,.92)":"rgba(12,14,19,.78)";rr(c,x,y,w,h,h/2);c.fill();
  if(e===me){c.strokeStyle="#ffb834";c.lineWidth=1.5;c.stroke()}
  c.fillStyle=e===me?"#ffb834":e.bot?"#c9d0db":"#fff";c.fillText(e.name,L.x,y+h/2+.5);
  var top=y;
  if(fs>=13||e===me){c.font="500 "+fs*.78+"px "+FONT;c.fillStyle="rgba(255,255,255,.72)";c.fillText(e.look.title,L.x,y-fs*.62);top=y-fs*1.25}
  if(talking){
    var bf=clamp(L.k*.4,11,18);c.font="600 "+bf+"px "+FONT;
    var bw=c.measureText(e.say).width+bf*1.4,bh=bf*2,bx=clamp(L.x-bw/2,6,v.W-bw-6),by=top-bh-6;
    c.globalAlpha=clamp((e.sayT-now)/400,0,1);c.fillStyle="#fff";rr(c,bx,by,bw,bh,bf*.7);c.fill();
    c.beginPath();c.moveTo(L.x-5,by+bh-1);c.lineTo(L.x+5,by+bh-1);c.lineTo(L.x,by+bh+6);c.closePath();c.fill();
    c.fillStyle="#14161b";c.fillText(e.say,bx+bw/2,by+bh/2+.5);c.globalAlpha=1;
  }
}

/* ───────────── 메인 루프 ───────────── */
function resize(){var v=view,d=Math.min(devicePixelRatio||1,2);v.W=innerWidth;v.H=innerHeight;v.dpr=d;
  v.cv.width=v.W*d;v.cv.height=v.H*d;v.cx=v.W/2;v.cy=v.H/2;v.foc=Math.max(v.H,v.W*.62)*.95}
addEventListener("resize",resize);
var fLast=0,inRoom=false;
function frame(ts){
  requestAnimationFrame(frame);
  var time=ts/1000,dt=Math.min(.05,(ts-fLast)/1000);fLast=ts;
  if(!inRoom){drawPreview(time);return}
  var v=view,c=v.ctx,i,e;
  // 내 개미 이동
  if(me){
    var ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0), iz=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
    if(ix||iz){moveTarget=null;lastInput=ts;if(me.ai)me.ai.wait=0;
      var fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw),rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw);
      var dx=fx*iz+rx*ix,dz=fz*iz+rz*ix,L=Math.hypot(dx,dz);me.x+=dx/L*5.2*dt;me.z+=dz/L*5.2*dt;me.r=Math.atan2(dx,dz);me.moving=true;
    }else if(moveTarget){
      var mx=moveTarget[0]-me.x,mz=moveTarget[1]-me.z,ML=Math.hypot(mx,mz);
      if(ML<.12){moveTarget=null;me.moving=false}else{var st=Math.min(ML,5.2*dt);me.x+=mx/ML*st;me.z+=mz/ML*st;me.r=Math.atan2(mx,mz);me.moving=true}
    }else if(autoWalk&&ts-lastInput>1500){if(!me.ai)me.ai={gx:me.x,gz:me.z,wait:1};wander(me,dt,2.4)}
    else me.moving=false;
    me.x=clamp(me.x,-RW+.8,RW-.8);me.z=clamp(me.z,-RD+.8,RD-.8);
  }
  // 다른 개미 보간
  for(i=0;i<order.length;i++){e=ents[order[i]];if(e===me||(isHost&&e.bot))continue;
    var ddx=e.tx-e.x,ddz=e.tz-e.z,D=Math.hypot(ddx,ddz),kk=Math.min(1,dt*9);
    e.moving=D>.06;e.x+=ddx*kk;e.z+=ddz*kk;var dr=Math.atan2(Math.sin(e.tr-e.r),Math.cos(e.tr-e.r));e.r+=dr*Math.min(1,dt*10)}
  // 그리기
  c.setTransform(v.dpr,0,0,v.dpr,0,0);c.clearRect(0,0,v.W,v.H);
  var T=me?[me.x,4.6,me.z]:[0,4,4];setCam(v,T,cam.yaw,cam.pitch,cam.dist);
  drawRoom(v,time);
  var list=[];for(i=0;i<order.length;i++){e=ents[order[i]];var b=toView(v,e.x,0,e.z);if(b[2]>NEAR+.6)list.push([b[2],e])}
  list.sort(function(a,b){return b[0]-a[0]});
  var labels=[];for(i=0;i<list.length;i++){var Lb=drawAnt(v,list[i][1],time);if(Lb)labels.push([list[i][1],Lb])}
  var now=performance.now(),kept=[],show=[],j;
  for(i=labels.length-1;i>=0;i--){ // 가까운 개미부터 자리 잡고, 겹치는 이름표는 생략
    var le=labels[i][0],ll=labels[i][1],lf=clamp(ll.k*.36,9.5,17),lw=(le.name.length*lf+lf*1.3)/2+4,lh=lf*3.2,hit=false;
    var must=le===me||(le.say&&now<le.sayT)||!le.bot;
    if(!must)for(j=0;j<kept.length;j++){var kq=kept[j];if(Math.abs(kq[0]-ll.x)<kq[2]+lw&&ll.y>kq[1]-lh&&ll.y-lh<kq[1]){hit=true;break}}
    if(hit)continue;kept.push([ll.x,ll.y,lw]);show.push(labels[i]);}
  for(i=show.length-1;i>=0;i--)if(show[i][0]!==me)drawLabel(v,show[i][0],show[i][1],now);
  for(i=0;i<show.length;i++)if(show[i][0]===me)drawLabel(v,show[i][0],show[i][1],now);
}

/* ───────────── 입력 ───────────── */
addEventListener("keydown",function(ev){
  if(!inRoom)return;var k=ev.key.toLowerCase(),inInput=/input|textarea/i.test(document.activeElement.tagName);
  if(k==="enter"&&!inInput){$("chat").focus();ev.preventDefault();return}
  if(k==="escape"){document.activeElement.blur();$("pop").classList.remove("show");return}
  if(inInput)return;keys[k]=true;if(k.indexOf("arrow")===0)ev.preventDefault()});
addEventListener("keyup",function(ev){keys[ev.key.toLowerCase()]=false});
addEventListener("blur",function(){keys={}});
(function(){
  var cv=$("cv"),down=null,drag=false;
  cv.addEventListener("pointerdown",function(ev){down={x:ev.clientX,y:ev.clientY};drag=false;cv.setPointerCapture(ev.pointerId);document.activeElement.blur()});
  cv.addEventListener("pointermove",function(ev){if(!down)return;var dx=ev.clientX-down.x,dy=ev.clientY-down.y;
    if(!drag&&Math.hypot(dx,dy)>6)drag=true;
    if(drag){cam.yaw-=dx*.005;cam.pitch=clamp(cam.pitch+dy*.004,.02,1.25);down={x:ev.clientX,y:ev.clientY}}});
  cv.addEventListener("pointerup",function(ev){
    if(down&&!drag&&me){var v=view,a=(ev.clientX-v.cx)/v.foc,b=-(ev.clientY-v.cy)/v.foc;
      var d=[v.R[0]*a+v.U[0]*b+v.F[0],v.R[1]*a+v.U[1]*b+v.F[1],v.R[2]*a+v.U[2]*b+v.F[2]];
      if(d[1]<-.01){var t=-v.C[1]/d[1],x=v.C[0]+d[0]*t,z=v.C[2]+d[2]*t;
        if(Math.abs(x)<RW+3&&Math.abs(z)<RD+3){moveTarget=[clamp(x,-RW+.8,RW-.8),clamp(z,-RD+.8,RD-.8)];lastInput=performance.now();if(me.ai)me.ai.wait=0}}}
    down=null});
  cv.addEventListener("pointercancel",function(){down=null});
  cv.addEventListener("wheel",function(ev){ev.preventDefault();cam.dist=clamp(cam.dist*(ev.deltaY>0?1.1:.9),4,34)},{passive:false});
})();
var toastT=0;
function toast(s,ms){var t=$("toast");t.textContent=s;t.classList.add("show");clearTimeout(toastT);if((ms||2600)<1e8)toastT=setTimeout(function(){t.classList.remove("show")},ms||2600)}

var chatLast=0;
$("chatbar").addEventListener("submit",function(ev){ev.preventDefault();
  var s=clean($("chat").value,60);if(!s||!me)return;var now=Date.now();
  if(now-chatLast<2000){toast("조금 뒤에 다시 쓸 수 있어요");return}
  chatLast=now;$("chat").value="";
  if(isHost){say(myId,s);castAll({t:"c",id:myId,s:s})}else if(hostConn)hostConn.send({t:"c",s:s});
});
function inviteLink(){return location.href.split("#")[0]+"#room-"+roomCode}
$("bInvite").onclick=function(){var l=inviteLink();$("link").value=l;
  var p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(l):Promise.reject();
  p.then(function(){toast("초대 링크를 복사했습니다")},function(){$("pop").classList.add("show");$("link").focus();$("link").select();toast("링크를 직접 복사해 주세요")})};
$("bSound").onclick=function(){if(!ytFrame){toast("아직 방송이 없습니다");return}
  muted=!muted;if(muted)ytCmd("mute");else{ytCmd("unMute");ytCmd("setVolume",[100]);ytCmd("playVideo")}
  this.textContent=muted?"소리 켜기":"소리 끄기";this.classList.toggle("on",!muted)};
$("bPass").onclick=function(){var on=$("cv").classList.toggle("pass");this.classList.toggle("on",on);
  toast(on?"유튜브 화면을 직접 클릭할 수 있습니다. 다시 누르면 개미 조작으로 돌아옵니다":"개미 조작으로 돌아왔습니다",3500)};
$("bWalk").onclick=function(){autoWalk=!autoWalk;this.classList.toggle("on",autoWalk);if(me)me.ai=null};
$("bSet").onclick=function(){$("link").value=inviteLink();$("pop").classList.toggle("show")};
$("ytGo").onclick=function(){var raw=$("yt").value,id=ytId(raw);
  if(raw.trim()&&!id){toast("유튜브 주소를 알아보지 못했습니다");return}
  setVideo(id);toast(id?"방송을 틀었습니다":"방송을 껐습니다")};
$("bots").oninput=function(){$("botsN").textContent=this.value;setBots(+this.value)};

/* ───────────── 입장 흐름 ───────────── */
var joinCode=(location.hash.match(/^#room-([a-z0-9]{4,12})$/)||[])[1]||"";
function status(s,err){var el=$("estatus");el.textContent=s;el.classList.toggle("err",!!err)}
function fail(s){status(s,true);$("go").disabled=false;$("alt").style.display="";$("alt").textContent="새 방 만들기"}
function enterRoom(){
  inRoom=true;$("entry").classList.add("hide");resize();
  $("hostOnly").style.display=isHost?"":"none";
  $("popNote").textContent=isHost
    ?(useBC?"지금은 같은 브라우저의 탭끼리만 연결되는 시험 모드입니다.":"방장이 이 탭을 닫으면 방이 사라집니다. 탭을 화면에 띄워 두세요.")
    :"방송 주소와 봇 수는 방장만 바꿀 수 있습니다.";
  if(!simLast){simLast=performance.now();setInterval(tick,110)}
  if(location.protocol==="file:")toast("파일로 직접 열면 유튜브가 재생되지 않을 수 있습니다. 웹에 올려서 열어 주세요.",6000);
}
function startHost(name){
  roomCode="";var al="abcdefghjkmnpqrstuvwxyz23456789";for(var i=0;i<6;i++)roomCode+=al[(Math.random()*al.length)|0];
  status("방을 만드는 중...");
  var ready=function(online){
    isHost=true;myId="h";var p=spawnPos();me=addEnt("h",name,false,p[0]*.3,8,Math.PI);setBots(botTarget);
    try{history.replaceState(null,"","#room-"+roomCode)}catch(_){location.hash="room-"+roomCode}
    enterRoom();
    if(!online)toast("연결 서버에 닿지 못했습니다. 지금은 혼자 보기 모드입니다.",6000);
  };
  (useBC?bcHost(roomCode,hostOnConn):pjHost(roomCode,hostOnConn)).then(function(){ready(true)},function(){ready(false)});
}
function startJoin(name,code){
  roomCode=code;status("방에 들어가는 중...");
  (useBC?bcJoin(code):pjJoin(code)).then(function(c){
    hostConn=c;c.ondata=clientOnData;c.onclose=function(){toast("방장과 연결이 끊겼습니다. 새로고침해서 다시 들어와 주세요.",1e9)};
    c.send({t:"hi",n:name});
  },function(){fail("방을 찾지 못했습니다. 방장이 방을 열어 두었는지 확인해 주세요.")});
}
$("name").addEventListener("input",function(){var n=clean(this.value,12);$("go").disabled=!n;
  pvEnt.look=lookOf(n);$("pvtitle").textContent=n?pvEnt.look.title:""});
$("name").addEventListener("keydown",function(ev){if(ev.key==="Enter"&&!$("go").disabled)$("go").click()});
$("go").onclick=function(){var n=clean($("name").value,12);if(!n)return;this.disabled=true;if(joinCode)startJoin(n,joinCode);else startHost(n)};
$("alt").onclick=function(){joinCode="";this.style.display="none";$("go").textContent="방 만들기";$("go").disabled=!clean($("name").value,12);status("")};
if(joinCode){$("go").textContent="입장하기";$("alt").style.display="";status("초대받은 방: "+joinCode)}else $("go").textContent="방 만들기";
$("name").focus();
requestAnimationFrame(frame);
window.__dbg={ents:function(){return ents},me:function(){return me},cam:cam,setVideo:setVideo};
})();
